services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 3s
      retries: 20
  api:
    build: .
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed && pnpm dev:api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://factory:factory@postgres:5432/factory
      ARTIFACT_ROOT: /workspaces
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["workspaces:/workspaces:ro"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  workspaces:
    name: agent-factory-workspaces
