name: Container delivery
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-delivery-main
  cancel-in-progress: false
jobs:
  assess:
    name: Require integrated main and green CI
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.scope.outputs.full_system }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Verify revision belongs to current main
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          main=$(git rev-parse origin/main)
          test "$sha" = "$main"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            gh run list --workflow ci.yml --branch main --commit "$sha" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
          fi
      - name: Assess complete system
        id: scope
        run: node scripts/ci/inspect.mjs
      - name: Fail explicit delivery request when integration is missing
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/ci/inspect.mjs --require-system
      - name: Explain blocked automatic delivery
        if: steps.scope.outputs.full_system != 'true'
        run: echo 'Container delivery is blocked: runtime, console, acceptance harness or container definitions are incomplete. No images were published.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish immutable commit images
    needs: assess
    if: needs.assess.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            file: Dockerfile
          - component: worker
            file: apps/worker/Dockerfile
          - component: web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assess.outputs.sha }}
          persist-credentials: false
      - name: Resolve immutable image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
          SHA: ${{ needs.assess.outputs.sha }}
        run: |
          name=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/$name-$COMPONENT:sha-$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Record delivered digest
        env:
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$TAG" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
